name: Build and Release SteamSmartSwitcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract Release Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ($env:GITHUB_REF -match "refs/tags/v?(.*)") {
              $ver = $matches[1]
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "Building version: $ver"

      - name: Compile Single Standalone Executable with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconsole --onefile --name="SteamSmartSwitcher" --clean main.py
          Move-Item -Path "dist\SteamSmartSwitcher.exe" -Destination "SteamSmartSwitcher.exe" -Force

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $zipName = "SteamSmartSwitcher_v$($env:VERSION)_Portable.zip"
          Compress-Archive -Path "SteamSmartSwitcher.exe", "README.md", "LICENSE" -DestinationPath $zipName
          echo "PORTABLE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Steam Smart Switcher v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SteamSmartSwitcher.exe
            ${{ env.PORTABLE_ZIP }}
