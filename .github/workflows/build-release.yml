name: Build and Release SteamSmartSwitcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Extract Release Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ($env:GITHUB_REF -match "refs/tags/v?(.*)") {
              $ver = $matches[1]
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "Building version: $ver"

      - name: Compile Native C Standalone Executable with Nuitka
        shell: pwsh
        run: |
          python -m nuitka --standalone --onefile --windows-console-mode=disable --enable-plugin=tk-inter --include-data-dir=assets=assets --windows-icon-from-ico=assets/icon.ico --output-filename=SteamSmartSwitcher.exe --assume-yes-for-downloads main.py

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Steam Smart Switcher v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SteamSmartSwitcher.exe
